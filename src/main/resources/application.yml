spring:
  application:
    name: shop-app
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:shopdb}
    username: ${DB_USER:user}
    password: ${DB_PASSWORD:passwd}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: REDIS
    redis:
      time-to-live: 600000
      cache-null-values: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      show-details: ALWAYS

logging:
  pattern:
    console:  "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%blue(%t)] [%cyan(%X{correlationId})] %logger{36} : %msg%n"
  level:
    root: info
    com.example.shop_app: debug
    cache: trace
resilience4j:
  circuitbreaker:
    instances:
      paymentGateway:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    expiration-time: 86400000