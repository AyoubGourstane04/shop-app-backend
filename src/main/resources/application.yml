spring:
  application:
    name: shop-app
  datasource:
    url: jdbc:postgresql://localhost:5432/shopdb
    username: user
    password: passwd
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration