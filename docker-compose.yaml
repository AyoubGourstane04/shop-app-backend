services:
  shop-app:
    image: postgres:16
    container_name: shop-app

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: shopdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: passwd
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: shop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: