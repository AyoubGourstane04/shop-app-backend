spring:
  application:
    name: shop-app
  datasource:
    url: jdbc:postgresql://localhost:5432/shopdb
    username: user
    password: passwd
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: REDIS
    redis:
      time-to-live: 600000
      cache-null-values: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
logging:
  level:
    root: info
    web: debug
    cache: trace